<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc"><title id="title">文档、执行资源与代码的职责划分</title><desc id="desc">Vault 保存知识与项目文档，runtime 保存执行资源与证据，Repo 保存源码并通过 Git 管理版本。</desc><rect width="1200" height="292" rx="12" fill="#F5F3F7"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><path d="M407 34V257M808 34V257" fill="none" stroke="#D8D1E1" stroke-width="2"/><text x="40" y="70" font-size="32" fill="#655184" font-weight="650">Vault</text><text x="40" y="114" font-size="25" fill="#2D2738" font-weight="600">知识与项目文档</text><text x="40" y="163" font-size="20" fill="#5D526C" font-weight="400">项目背景 · 任务摘要 · 决策记录</text><text x="40" y="202" font-size="20" fill="#5D526C" font-weight="400">Markdown / Obsidian / VS Code</text><text x="40" y="255" font-size="18" fill="#5D526C" font-weight="400">维护当前知识与结论</text><text x="446" y="70" font-size="32" fill="#655184" font-weight="650">runtime</text><text x="446" y="114" font-size="25" fill="#2D2738" font-weight="600">执行资源与证据</text><text x="446" y="163" font-size="20" fill="#5D526C" font-weight="400">输入数据 · 结果 · 日志 · 环境</text><text x="446" y="202" font-size="20" fill="#5D526C" font-weight="400">按 Project / Task / Run 组织</text><text x="446" y="255" font-size="18" fill="#5D526C" font-weight="400">保留执行事实与来源</text><text x="847" y="70" font-size="32" fill="#655184" font-weight="650">Repo</text><text x="847" y="114" font-size="25" fill="#2D2738" font-weight="600">源码与版本管理</text><text x="847" y="163" font-size="20" fill="#5D526C" font-weight="400">源码 · 测试 · 构建声明</text><text x="847" y="202" font-size="20" fill="#5D526C" font-weight="400">通过本机绑定关联项目</text><text x="847" y="255" font-size="18" fill="#5D526C" font-weight="400">使用 Git 管理代码演进</text></g></svg>