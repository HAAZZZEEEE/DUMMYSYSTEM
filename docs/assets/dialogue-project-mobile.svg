<svg xmlns="http://www.w3.org/2000/svg" width="560" height="414" viewBox="0 0 560 414" role="img" aria-labelledby="title desc"><title id="title">创建项目</title><desc id="desc">用户：创建一个 Qwen Image 实验室项目，用来研究图像生成的效果和性能。 Agent：已创建「Qwen Image 实验室」，记录了研究目标和资料入口。后续实验、配置与结果都会归入这个项目。 对话为工作流示意。</desc><rect width="560" height="414" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="540" y="25" font-size="20" fill="#5D526C" font-weight="500" text-anchor="end">你</text><rect x="84" y="40" width="456" height="104" rx="16" fill="#78659D"/><path d="M514 140 L540 151 L537 122Z" fill="#78659D"/><text x="106" y="80" font-size="26" fill="#ffffff" font-weight="400">创建一个 Qwen Image 实验室项目，</text><text x="106" y="118" font-size="26" fill="#ffffff" font-weight="400">用来研究图像生成的效果和性能。</text><text x="20" y="192" font-size="20" fill="#5D526C" font-weight="600">Agent</text><rect x="20" y="206" width="520" height="182" rx="16" fill="#DDE8C9"/><path d="M46 384 L20 395 L23 366Z" fill="#DDE8C9"/><text x="42" y="246" font-size="26" fill="#2D2738" font-weight="400">已创建「Qwen Image 实验室」，</text><text x="42" y="284" font-size="26" fill="#2D2738" font-weight="400">记录了研究目标和资料入口。</text><text x="42" y="322" font-size="26" fill="#2D2738" font-weight="400">后续实验、配置与结果都会归入</text><text x="42" y="360" font-size="26" fill="#2D2738" font-weight="400">这个项目。</text></g></svg>