<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1020" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">Project / Task / Run 上下文模型</title><desc id="desc">项目下包含多个任务；任务下包含多次执行。失败保留，重试另建记录。</desc><rect width="600" height="1020" rx="12" fill="#F5F3F7"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><path d="M300 176V236M300 386V440M300 440H72M72 440V866M72 504H112M72 660H112M72 816H112" fill="none" stroke="#A79BB8" stroke-width="2"/><rect x="40" y="38" width="520" height="138" rx="10" fill="#78659D" stroke="#78659D"/><text x="66" y="82" font-size="28" fill="#F5F3F7" font-weight="600">Project · 项目</text><text x="66" y="132" font-size="32" fill="#fff" font-weight="600">Qwen Image 2.1 实验室</text><rect x="40" y="236" width="520" height="150" rx="10" fill="#EAF0DF" stroke="#91A36F"/><text x="66" y="279" font-size="28" fill="#5D526C" font-weight="600">Task · 任务</text><text x="66" y="322" font-size="32" fill="#2D2738" font-weight="600">比较采样配置</text><text x="66" y="358" font-size="22" fill="#5D526C" font-weight="400">项目中的一项工作，维护当前摘要与下一步</text><rect x="112" y="450" width="448" height="128" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="136" y="485" font-size="24" fill="#5D526C" font-weight="600">Run · 执行</text><text x="480" y="485" font-size="22" fill="#52663A" font-weight="600">完成</text><text x="136" y="525" font-size="28" fill="#2D2738" font-weight="600">基线配置</text><text x="136" y="559" font-size="21" fill="#5D526C" font-weight="400">输入、配置与结果</text><rect x="112" y="606" width="448" height="128" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="136" y="641" font-size="24" fill="#5D526C" font-weight="600">Run · 执行</text><text x="480" y="641" font-size="22" fill="#8C5933" font-weight="600">失败</text><text x="136" y="681" font-size="28" fill="#2D2738" font-weight="600">扩大批量</text><text x="136" y="715" font-size="21" fill="#5D526C" font-weight="400">保留失败事实与证据</text><rect x="112" y="762" width="448" height="128" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="136" y="797" font-size="24" fill="#5D526C" font-weight="600">Run · 执行</text><text x="480" y="797" font-size="22" fill="#52663A" font-weight="600">完成</text><text x="136" y="837" font-size="28" fill="#2D2738" font-weight="600">调整配置后重试</text><text x="136" y="871" font-size="21" fill="#5D526C" font-weight="400">创建新 Run，独立保存结果</text><text x="40" y="935" font-size="22" fill="#5D526C" font-weight="400">一个项目包含多个任务，每项任务可以多次执行。</text><text x="40" y="978" font-size="24" fill="#2D2738" font-weight="600">接续：项目背景 → 当前摘要 → 执行证据</text></g></svg>