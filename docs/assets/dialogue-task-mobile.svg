<svg xmlns="http://www.w3.org/2000/svg" width="560" height="414" viewBox="0 0 560 414" role="img" aria-labelledby="title desc"><title id="title">根据目标建立任务</title><desc id="desc">用户：用同一组提示词比较 20 步和 30 步的生成效果，也记录耗时和显存。 Agent：已在项目下建立 Task「比较采样配置」。我会分别记录两次执行的配置、结果与日志，再汇总对比结论。 对话为工作流示意。</desc><rect width="560" height="414" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="540" y="25" font-size="20" fill="#5D526C" font-weight="500" text-anchor="end">你</text><rect x="84" y="40" width="456" height="104" rx="16" fill="#78659D"/><path d="M514 140 L540 151 L537 122Z" fill="#78659D"/><text x="106" y="80" font-size="26" fill="#ffffff" font-weight="400">用同一组提示词比较 20 步和 30 步</text><text x="106" y="118" font-size="26" fill="#ffffff" font-weight="400">的生成效果，也记录耗时和显存。</text><text x="20" y="192" font-size="20" fill="#5D526C" font-weight="600">Agent</text><rect x="20" y="206" width="520" height="182" rx="16" fill="#DDE8C9"/><path d="M46 384 L20 395 L23 366Z" fill="#DDE8C9"/><text x="42" y="246" font-size="26" fill="#2D2738" font-weight="400">已在项目下建立 Task</text><text x="42" y="284" font-size="26" fill="#2D2738" font-weight="400">「比较采样配置」。</text><text x="42" y="322" font-size="26" fill="#2D2738" font-weight="400">我会分别记录两次执行的配置、</text><text x="42" y="360" font-size="26" fill="#2D2738" font-weight="400">结果与日志，再汇总对比结论。</text></g></svg>