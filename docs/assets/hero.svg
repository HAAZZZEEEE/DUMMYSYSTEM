<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc"><title id="title">DUMMYSYS — 简单但高效的面向Agent 的持久化上下文管理方法论&amp;工具</title><desc id="desc">以治理规则和 CLI 组织项目背景、任务进展与执行证据。Workbench 是可选的可视化入口。</desc><rect width="1200" height="348" rx="12" fill="#2D2738"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="52" y="94" font-size="60" fill="#F5F3F7" font-weight="700">DUMMYSYS</text><text x="54" y="164" font-size="38" fill="#ADC67F" font-weight="600">简单但高效的面向Agent 的持久化上下文管理方法论&amp;工具</text><text x="55" y="211" font-size="24" fill="#D2CADF" font-weight="400">项目背景 · 任务进展 · 执行证据</text><path d="M54 258H1146" fill="none" stroke="#78659D" stroke-width="2"/><text x="55" y="306" font-size="22" fill="#ADC67F" font-weight="600">治理规则 + CLI</text><text x="292" y="306" font-size="20" fill="#D2CADF" font-weight="400">可独立使用的核心工作流</text><text x="794" y="306" font-size="22" fill="#ADC67F" font-weight="600">Workbench</text><text x="965" y="306" font-size="20" fill="#D2CADF" font-weight="400">可选可视化入口</text></g></svg>
