<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-labelledby="title desc"><title id="title">根据目标建立任务</title><desc id="desc">用户：用同一组提示词比较 20 步和 30 步的生成效果，也记录耗时和显存。 Agent：已在项目下建立 Task「比较采样配置」。我会分别记录两次执行的配置、结果与日志，再汇总对比结论。 对话为工作流示意。</desc><rect width="1000" height="356" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="980" y="25" font-size="17" fill="#5D526C" font-weight="500" text-anchor="end">你</text><rect x="280" y="40" width="700" height="96" rx="16" fill="#78659D"/><path d="M954 132 L980 143 L977 114Z" fill="#78659D"/><text x="302" y="76" font-size="23" fill="#ffffff" font-weight="400">用同一组提示词比较 20 步和 30 步的生成效果，</text><text x="302" y="110" font-size="23" fill="#ffffff" font-weight="400">也记录耗时和显存。</text><text x="20" y="184" font-size="17" fill="#5D526C" font-weight="600">Agent</text><rect x="20" y="198" width="820" height="132" rx="16" fill="#DDE8C9"/><path d="M46 326 L20 337 L23 308Z" fill="#DDE8C9"/><text x="42" y="234" font-size="23" fill="#2D2738" font-weight="400">已在项目下建立 Task「比较采样配置」。</text><text x="42" y="268" font-size="23" fill="#2D2738" font-weight="400">我会分别记录两次执行的配置、结果与日志，</text><text x="42" y="302" font-size="23" fill="#2D2738" font-weight="400">再汇总对比结论。</text></g></svg>