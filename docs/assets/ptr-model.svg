<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Project / Task / Run 上下文模型</title><desc id="desc">一个 Project 包含多个 Task。采样配置比较任务包含三次 Run，分别为基线完成、扩大批量失败及调整后重试完成。接续时从背景和摘要出发，按需查看执行证据。</desc><rect width="1200" height="680" rx="12" fill="#F5F3F7"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><path d="M600 140V182M214 182H986M214 182V216M600 182V216M986 182V216" fill="none" stroke="#A79BB8" stroke-width="2"/><path d="M600 322V384M300 384H900M300 384V430M600 384V430M900 384V430" fill="none" stroke="#A79BB8" stroke-width="2"/><rect x="420" y="28" width="360" height="112" rx="10" fill="#78659D" stroke="#78659D"/><text x="444" y="65" font-size="23" fill="#F5F3F7" font-weight="600">Project</text><text x="444" y="109" font-size="27" fill="#fff" font-weight="600">Qwen Image 2.1 实验室</text><text x="44" y="64" font-size="23" fill="#5D526C" font-weight="400">项目背景与总体目标</text><text x="44" y="100" font-size="20" fill="#5D526C" font-weight="400">定义持续工作的范围</text><rect x="44" y="216" width="340" height="106" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="66" y="252" font-size="22" fill="#5D526C" font-weight="600">Task</text><text x="66" y="294" font-size="25" fill="#2D2738" font-weight="600">建立基线与提示词集</text><rect x="430" y="216" width="340" height="106" rx="10" fill="#EAF0DF" stroke="#91A36F"/><text x="452" y="252" font-size="22" fill="#5D526C" font-weight="600">Task</text><text x="452" y="294" font-size="25" fill="#2D2738" font-weight="600">比较采样配置</text><rect x="816" y="216" width="340" height="106" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="838" y="252" font-size="22" fill="#5D526C" font-weight="600">Task</text><text x="838" y="294" font-size="25" fill="#2D2738" font-weight="600">整理结果与实验报告</text><text x="44" y="365" font-size="20" fill="#5D526C" font-weight="400">每项任务维护目标、当前摘要与下一步</text><rect x="174" y="430" width="252" height="126" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="194" y="463" font-size="21" fill="#5D526C" font-weight="600">Run</text><text x="347" y="463" font-size="19" fill="#52663A" font-weight="600">完成</text><text x="194" y="500" font-size="23" fill="#2D2738" font-weight="600">基线配置</text><text x="194" y="534" font-size="18" fill="#5D526C" font-weight="400">保留输入、配置与结果</text><rect x="474" y="430" width="252" height="126" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="494" y="463" font-size="21" fill="#5D526C" font-weight="600">Run</text><text x="647" y="463" font-size="19" fill="#8C5933" font-weight="600">失败</text><text x="494" y="500" font-size="23" fill="#2D2738" font-weight="600">扩大批量</text><text x="494" y="534" font-size="18" fill="#5D526C" font-weight="400">保留失败事实与证据</text><rect x="774" y="430" width="252" height="126" rx="10" fill="#fff" stroke="#D8D1E1"/><text x="794" y="463" font-size="21" fill="#5D526C" font-weight="600">Run</text><text x="947" y="463" font-size="19" fill="#52663A" font-weight="600">完成</text><text x="794" y="500" font-size="23" fill="#2D2738" font-weight="600">调整配置后重试</text><text x="794" y="534" font-size="18" fill="#5D526C" font-weight="400">新 Run，独立保存结果</text><path d="M44 596H1156" fill="none" stroke="#D8D1E1" stroke-width="2"/><text x="44" y="633" font-size="21" fill="#2D2738" font-weight="600">接续路径</text><text x="165" y="633" font-size="22" fill="#5D526C" font-weight="400">项目背景 → 任务摘要 → 按需查询执行证据</text></g></svg>